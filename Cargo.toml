[package]
name = "rflow"
version = "0.1.0"
edition = "2024"
description = "Low-latency Linux keyboard and mouse sharing over QUIC"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3"
postcard = { version = "1.1", features = ["alloc"] }
quinn = "0.11"
rcgen = "0.14"
rustls = "0.23"
rustls-pki-types = "1.14"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
