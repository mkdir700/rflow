[package]
name = "rflow"
version = "0.1.0"
edition = "2024"
description = "Low-latency Linux keyboard and mouse sharing over QUIC"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
evdev = "0.13"
postcard = { version = "1.1", features = ["alloc"] }
quinn = "0.11"
rcgen = "0.14"
rustls = "0.23"
rustls-pki-types = "1.14"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
